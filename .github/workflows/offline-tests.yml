name: Offline validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned dependencies
        run: python3 -m pip install -r requirements.txt
      - name: Validate agent configuration and research inventory
        run: |
          python3 scripts/validate-codex.py
          python3 scripts/validate-research.py
      - name: Run existing offline suite
        run: bash scripts/test-offline.sh
