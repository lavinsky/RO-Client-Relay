# relay_capture.conf — default settings for relay_capture_linux.py
# =============================================================================
# With this file present you can just run the capturer, no launch options:
#
#     tail -f /dev/null | ~/.venv-frida/bin/python relay_capture_linux.py
#
# (The `tail -f /dev/null |` part only holds stdin open so the driver doesn't
#  EOF immediately — it is not a setting.)
#
# Every value below is also a normal command-line option, and the command line
# ALWAYS wins. So to do one read-only capture without changing this file:
#
#     ... relay_capture_linux.py --no-inject
#
# Format: plain INI. All settings go under the [capture] section. Keys are the
# long option names without the leading "--" (dashes and underscores both work).
# Booleans accept true/false (also yes/no, on/off, 1/0).
# "#" or ";" start a comment, including inline after a value.
# Point at a different file with --config <path>; a missing file just means the
# program's own built-in defaults are used.
# =============================================================================

[capture]

# -- what to capture / where to send it ---------------------------------------
# Client process to find the Frida gadget in. The gadget port is auto-detected
# by matching this name, so you normally don't need to set `port`.
name = uaRO.exe

# Feed decrypted server->client packets to the consumer's XKore 1 listener.
# Use host:port, or "" to disable the feed entirely (log only).
relay = 127.0.0.1:2350

# Framing for the feed: xkore1 = the consumer's X-Kore "R"/"S" frames (normal);
# raw = unframed bytes for a plain stream consumer.
relay-format = xkore1

# Sanitized JSONL capture log (credentials redacted). Relative to this folder.
out = relay_log.jsonl

# Saída do terminal: false = eventos relevantes; true = todos os pacotes e diagnósticos.
# O arquivo JSONL mantém os mesmos eventos em ambos os modos.
verbose = false

# -- injection (WRITE path) ---------------------------------------------------
# Master switch for making the client transmit packets the consumer chooses.
# true  -> every run arms the scrambler breakpoint below and may write to the
#          client's memory (for a client/server you own).
# false -> pure read-only capture (nothing is ever written to the client).
inject = true

# How long a written-back packet lasts:
#   false (one-shot, default) -> substitute only the NEXT matching client action,
#                         once, then hand control back to the client. Use this.
#   true  (persistent) -> substitute EVERY client action of the targeted id with
#                         the consumer's latest matching packet, until stopped.
#
# One-shot is the right mode for debugging. Persistent is a trap for 035f (walk):
# because the walk substitution can only act when the client itself builds a
# 035f, leaving it persistent redirects EVERY client walk -- including the
# walk-to-target that an attack (0437) triggers and the step a sit/stand needs,
# so attacks and sit/stand stop working. One-shot substitutes a single walk and
# then the client's own walks/attacks resume normally.
inject-persist = false

# Minimum seconds between injected cast-time skills (0438 em alvo, 0af4 no chão).
# O consumidor (OpenKore) re-tenta a perícia várias vezes; sem este limite os casts
# saem em rajada e cada um cancela o cast anterior (a perícia nunca completa).
# Deixa passar no máximo um cast por janela. 0 desliga. (Política que no futuro pode
# migrar para o plugin do consumidor.)
cast-throttle = 0.8

# Spontaneous send of the action packets (0437/0438: attack, sit/stand, skill)
# by calling the client's own SendPacket. This is what lets the CONSUMER drive
# those actions instead of only substituting an action the client itself starts.
# With inject-call + the scrambler pin below, the driver routes by id
# (writeback._on_inbound_split): 035f (walk) goes by the merge, everything else
# by SendPacket. They use different debug registers, so they coexist.
# Turn this OFF (and leave scramble-bp unset) for merge-only, reactive debugging.
inject-call = true

# Configuracao operacional padrao (antes passada pelo run_action_merge.sh).
move-dispatch = true
action-merge = true
egress-queue = false
synth-input = true
# Enviar teclas ao Gamescope via EIS privado, sem focar KDE/usar ydotool seat0.
# Inicie o jogo pelo Steam com scripts/gamescope-eis-session.sh (veja docs/OPERATIONS.md).
# Gamescope Wayland: -g --force-grab-cursor para teclado e cursor no login.
synth-backend = gamescope-eis
synth-eis-socket-file = /run/user/1000/ro-relay-gamescope-eis.path
# synth-eis-socket =   ; alternativa ao arquivo (não usar as duas ao mesmo tempo)
# synth-wid abaixo é legado e é IGNORADO quando synth-backend = gamescope-eis.
synth-wid = 0x05200001
synth-key-0437 = INSERT
synth-key-0438 = 9
synth-key-0af4 = F2
# Experimento 0x0439: input independente e síncrono antes do envio.
itemuse-input = true
itemuse-input-key = F2
# Ativar despacho sob demanda; --no-sendcall-demand na CLI desliga para diagnostico.
sendcall-demand = false
# Bloqueio de recaptura de this apos 0091/0092 ou reconexao.
map-settle-ms = 1500

# NOTE: when inject is on, --feed-send is auto-disabled. Feeding the client's
# own sends to the consumer while injecting would loop them straight back in
# and re-inject them (that floods the server and drops the session).

# -- scrambler breakpoint (how injected bytes get encrypted) ------------------
# Injection writes our plaintext into the packet slot just BEFORE the client's
# own in-place XOR encrypts it, so our bytes go out correctly encrypted with the
# live key. This needs to know WHERE the scrambler is and HOW it addresses the
# slot — four values that USED to be hand-set but are now AUTO-DISCOVERED.
#
# Leave `scramble-bp` UNSET (as below) and, with inject on, the capturer:
#   1. runs the send-watch, which reports the scrambler's write pc on the first
#      encrypted 0437/0438 you send (so do one in-client action to bootstrap);
#   2. disarms the watch and arms the exec breakpoint on that store;
#   3. self-locates the pointer register and id offset by matching the packet
#      id at the breakpoint (reg='auto'), and uses the recv-ring heap block
#      (found by --decrypt-actors) as the range.
# Nothing here is session- or ASLR-specific, so it just works each launch.
#
# Combined mode (inject-call on) PINS the scrambler, because inject-call takes
# the debug registers the auto-discovery send-watch would need. These are the
# values validated for this client for the 035f (walk) merge path:
#   - bp 18eff2: the in-place byte store inside gepard's scrambler;
#   - reg auto: the agent self-locates the slot pointer by matching the id;
#   - range 2632000-2730000: the area where the client builds the 035f.
# (To go back to merge-only auto-discovery, set inject-call = false and comment
#  these four out; discovery then needs one in-client 0437/0438 to bootstrap.)
scramble-bp    = 18eff2
scramble-reg   = auto
scramble-range =

# Packet id (hex) the merge path targets. In combined mode this is 035f (walk);
# the 0437/0438 actions go by SendPacket and key on their own id.
scramble-id = 035f

# -- other defaults you normally won't touch ----------------------------------
# These already match the program defaults; shown here so they're discoverable.
# Uncomment to change.
#
# wire = true                 ; feed cleartext wire bytes (vs legacy memory path)
# decrypt-actors = true       ; fill in encrypted 09fd/09ff bodies from client memory
actor-delay = 0.30           ; up to 300ms to observe decrypted actors (plus settle wait)
# drop-ids = 4754,5395,09fd,09ff ; Gepard control omitted; actors fed only after verified decryption
# recvpackets = uaro_recvpackets.txt   ; packet-length table for boundary alignment
