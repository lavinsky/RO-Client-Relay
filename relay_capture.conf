# Main operational configuration. CLI overrides these values.
# No game/client experiment is authorized merely by these defaults.
[capture]
name = uaRO.exe
relay = 127.0.0.1:2350
relay-format = xkore1
out = relay_log.jsonl

# Intentional operational invariants: keep both enabled.
inject = true
inject-call = true

# Client constructs/encrypts movement and natural action carriers.
move-dispatch = true
action-merge = true
synth-input = true
# Defaults: INSERT / top-row 9 / F2. Empty window id = title discovery.
synth-wid =

# Build-specific scrambler anchor, also used by the previous operational launcher.
# Empty range avoids a stale session address and accepts validated action carriers.
scramble-bp = 18eff2
scramble-reg = auto
scramble-range =
scramble-id = 035f

# Actor recovery remains conservative. Command cadence belongs to OpenKore.
# actor-delay = 0.15
# decrypt-actors = true
# drop-ids = 09fd,09ff
